<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-weight: 100 900; font-display: block; src: url("assets/fonts/inter-var.woff2") format("woff2"); }
      @font-face { font-family: "Playfair Display"; font-weight: 400 900; font-display: block; src: url("assets/fonts/playfair-var.woff2") format("woff2"); }
      @font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-display: block; src: url("assets/fonts/jetbrains-mono-var.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; font-weight: 400; font-display: block; src: url("assets/fonts/anton-400.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: block; src: url("assets/fonts/instrument-serif-latin-400-italic.woff2") format("woff2"); }
      @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: block; src: url("assets/fonts/instrument-serif-latin-ext-400-italic.woff2") format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Inter", sans-serif; }
      /* The camera: everything that lives in the picture (plate, the layer behind the person, the person, the layer
         in front) moves together, so a zoom or a split keeps text pinned to the face. #top sits outside it. */
      #cam, .layer, .wrap { position: absolute; inset: 0; }
      #cam { transform-origin: 50% 40%; }
      .wrap video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      #person-wrap { visibility: hidden; }
      .fx-root { position: absolute; inset: 0; visibility: hidden; }
      .lead { font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; color: #ffd84a; }
      .big { font-family: "Inter", sans-serif; font-weight: 900; color: #fff; letter-spacing: -0.02em; }
      .halo { text-shadow: 0 4px 28px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.45); }
      .mono { font-family: "JetBrains Mono", monospace; }
      {{EFFECTS_CSS}}
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="cam">
        <div id="plate-wrap" class="wrap">
          <video id="plate" class="clip" src="assets/plate.mp4" muted playsinline data-start="0" data-duration="{{DUR}}" data-track-index="0"></video>
        </div>
        <div id="back" class="layer"></div>
        <div id="person-wrap" class="wrap">
          <video id="person" class="clip" src="assets/person.webm" muted playsinline data-start="0" data-duration="{{DUR}}" data-track-index="1"></video>
        </div>
        <div id="front" class="layer"></div>
      </div>
      <div id="top" class="layer"></div>
    </div>
    <script>
      // one inline script, in this order: HyperFrames reorders separate scripts when it assembles the page
      window.EFEKT_DATA = {{DATA}};
{{RUNTIME_JS}}
{{EFFECTS_JS}}
      window.__timelines = window.__timelines || {};
      const tl = EFEKT.build();
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
